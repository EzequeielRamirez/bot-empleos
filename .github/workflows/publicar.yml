name: Publicar ofertas de trabajo

on:
  schedule:
    # GitHub saltea muchas ejecuciones programadas cuando está cargado, así que se intenta
    # cada 10 minutos y el paso "¿Toca publicar?" deja pasar solo una por hora.
    - cron: "*/10 * * * *"
  workflow_dispatch:       # botón "Run workflow" para probar a mano
    inputs:
      modo:
        description: "publicar = publica de verdad · sin-publicar = solo busca y genera tarjetas"
        default: publicar
        type: choice
        options: [publicar, sin-publicar]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ¿Toca publicar?
        id: control
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          if os.environ["EVENTO"] != "schedule":
              print("seguir=true"); raise SystemExit
          try:
              publicados = json.load(open("estado.json")).get("publicados", [])
              ultima = datetime.fromisoformat(publicados[-1]["fecha"])
              minutos = (datetime.now(timezone.utc) - ultima).total_seconds() / 60
          except Exception:
              minutos = 999
          print(f"seguir={'true' if minutos >= 55 else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"
        env:
          EVENTO: ${{ github.event_name }}

      - uses: actions/setup-python@v5
        if: steps.control.outputs.seguir == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.control.outputs.seguir == 'true'
        run: pip install -r requirements.txt
      - name: Buscar y publicar
        if: steps.control.outputs.seguir == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID_TCM: ${{ secrets.IG_ID_TCM }}
          IG_ID_BTU: ${{ secrets.IG_ID_BTU }}
        run: |
          git config user.name "bot-empleos"
          git config user.email "bot-empleos@users.noreply.github.com"
          if [ "${{ inputs.modo }}" = "sin-publicar" ]; then
            python bot.py --sin-publicar
          else
            python bot.py
          fi
