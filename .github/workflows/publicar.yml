name: Publicar ofertas de trabajo

on:
  schedule:
    - cron: "0 * * * *"   # cada hora, en punto (hora UTC)
  workflow_dispatch:       # botón "Run workflow" para probar a mano
    inputs:
      modo:
        description: "publicar = publica de verdad · sin-publicar = solo busca y genera tarjetas"
        default: publicar
        type: choice
        options: [publicar, sin-publicar]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar y publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID_TCM: ${{ secrets.IG_ID_TCM }}
          IG_ID_BTU: ${{ secrets.IG_ID_BTU }}
        run: |
          git config user.name "bot-empleos"
          git config user.email "bot-empleos@users.noreply.github.com"
          if [ "${{ inputs.modo }}" = "sin-publicar" ]; then
            python bot.py --sin-publicar
          else
            python bot.py
          fi

