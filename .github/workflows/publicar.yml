name: Publicar ofertas de trabajo

on:
  # Lo lanza el reloj (reloj.yml) una vez por hora. El programador de GitHub ("schedule")
  # se quitó: a veces corría al mismo tiempo que el reloj y duplicaba publicaciones.
  workflow_dispatch:       # botón "Run workflow" para probar a mano
    inputs:
      modo:
        description: "publicar = publica de verdad · sin-publicar = solo busca y genera tarjetas"
        default: publicar
        type: choice
        options: [publicar, sin-publicar]
      forzar:
        description: "Publicar aunque no haya pasado 1 hora desde la última vez"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ¿Toca publicar?
        id: control
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          # Los avisos automáticos (horario de GitHub o disparador externo) se filtran para
          # no publicar dos veces en la misma hora; las pruebas a mano pueden forzar.
          if os.environ["FORZAR"] == "true" or os.environ["MODO"] == "sin-publicar":
              print("seguir=true"); raise SystemExit
          try:
              estado = json.load(open("estado.json"))
              ultima = datetime.fromisoformat(estado.get("ultima_ejecucion") or estado["publicados"][-1]["fecha"])
              minutos = (datetime.now(timezone.utc) - ultima).total_seconds() / 60
          except Exception:
              minutos = 999
          print(f"seguir={'true' if minutos >= 45 else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"
        env:
          FORZAR: ${{ inputs.forzar || 'false' }}
          MODO: ${{ inputs.modo || 'publicar' }}

      - uses: actions/setup-python@v5
        if: steps.control.outputs.seguir == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.control.outputs.seguir == 'true'
        run: pip install -r requirements.txt
      - name: Buscar y publicar
        if: steps.control.outputs.seguir == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID_TCM: ${{ secrets.IG_ID_TCM }}
          IG_ID_BTU: ${{ secrets.IG_ID_BTU }}
          FORZAR: ${{ inputs.forzar || 'false' }}
        run: |
          git config user.name "bot-empleos"
          git config user.email "bot-empleos@users.noreply.github.com"
          if [ "${{ inputs.modo }}" = "sin-publicar" ]; then
            python -u bot.py --sin-publicar
          else
            python -u bot.py
          fi
