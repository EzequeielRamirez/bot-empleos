name: Ver IDs de mis cuentas

on:
  workflow_dispatch:

jobs:
  ver-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py --configurar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
